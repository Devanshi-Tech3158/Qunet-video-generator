<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#180e29"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7f55"/>
      <stop offset="100%" stop-color="#ff9e78"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="320" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="reel-grad" x1="0" y1="0" x2="220" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a1b16"/>
      <stop offset="50%" stop-color="#442b21"/>
      <stop offset="100%" stop-color="#17110e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="180" fill="#ff7f55" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="220" fill="#818cf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="650" cy="200" r="160" fill="#f43f5e" opacity="0.08" filter="url(#glow)"/>

  <!-- Top Badges -->
  <g transform="translate(60, 50)">
    <!-- Hackathon Badge -->
    <rect width="260" height="36" rx="18" fill="#ff7f55" fill-opacity="0.15" stroke="#ff7f55" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="130" y="23" fill="#ff9e78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🏆 Built for Hack Briven Hackathon</text>

    <!-- Group Project Badge -->
    <rect x="275" width="160" height="36" rx="18" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="355" y="23" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">👥 Group Submission</text>
  </g>

  <!-- Title & Description -->
  <g transform="translate(60, 130)">
    <text x="0" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">Qunet Video Generator</text>
    <text x="0" y="90" fill="#ff9e78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">CreatorDNA Studio · AI Short-Video Synthesis</text>
    <text x="0" y="130" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" width="500">
      <tspan x="0" dy="0">Learns your persistent content fingerprint to turn any idea into a</tspan>
      <tspan x="0" dy="24">finished 9:16 short video tailored for the Qoneqt social feed.</tspan>
    </text>
  </g>

  <!-- Key Capability Pills -->
  <g transform="translate(60, 310)">
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🧬 Creator DNA Sync</text>
    </g>
    <g transform="translate(195, 0)">
      <rect width="180" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔥 Trend Remix &amp; Hooks</text>
    </g>
    <g transform="translate(390, 0)">
      <rect width="180" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🎙️ Gemini Live Voice Coach</text>
    </g>
  </g>

  <g transform="translate(60, 365)">
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">👥 Audience Mirror AI</text>
    </g>
    <g transform="translate(195, 0)">
      <rect width="180" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🎬 8-Stage Render Engine</text>
    </g>
    <g transform="translate(390, 0)">
      <rect width="180" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="90" y="26" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Qoneqt REST API</text>
    </g>
  </g>

  <!-- Live Deployed URL Box -->
  <g transform="translate(60, 445)">
    <rect width="570" height="60" rx="16" fill="#0f172a" stroke="#ff7f55" stroke-width="2"/>
    <text x="25" y="36" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600">🌐 Live Web App:</text>
    <text x="160" y="36" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">https://devanshi-tech3158.github.io/Qunet-video-generator/</text>
  </g>

  <!-- Live Metrics Banner -->
  <g transform="translate(60, 530)">
    <text x="0" y="22" fill="#64748b" font-family="sans-serif" font-size="13" font-weight="500">1,047 Monorepo Tests Passing · 100% Type-Safe · React 19 + Vite · Gemini 2.0</text>
  </g>

  <!-- Right Visual: Phone Reel Mockup + Studio Cards -->
  <!-- 9:16 Vertical Reel Device -->
  <g transform="translate(880, 80)">
    <!-- Device Shell -->
    <rect width="250" height="470" rx="36" fill="#020617" stroke="#334155" stroke-width="4" filter="url(#glow)"/>
    <rect x="8" y="8" width="234" height="454" rx="28" fill="url(#reel-grad)"/>

    <!-- Screen Notch -->
    <rect x="85" y="16" width="80" height="18" rx="9" fill="#020617"/>

    <!-- Video Preview Header -->
    <text x="24" y="60" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Qoneqt Feed · 9:16</text>
    <circle cx="210" cy="56" r="6" fill="#22c55e"/>

    <!-- Coding Algorithm Thumbnail Illustration Inside Reel -->
    <rect x="20" y="80" width="210" height="160" rx="16" fill="#1e293b"/>
    <!-- Binary Search Diagram inside reel -->
    <rect x="35" y="100" width="180" height="24" rx="6" fill="#334155"/>
    <text x="45" y="117" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">[1, 3, 7, 12, 19, 24]</text>
    <circle cx="125" cy="112" r="10" fill="#ff7f55" opacity="0.3"/>
    <text x="120" y="116" fill="#ff9e78" font-family="sans-serif" font-size="10" font-weight="bold">↑</text>

    <!-- Caption Overlay -->
    <rect x="20" y="260" width="210" height="70" rx="14" fill="#000000" fill-opacity="0.6"/>
    <text x="32" y="285" fill="#fde047" font-family="sans-serif" font-size="12" font-weight="800">POV: Binary Search clicks!</text>
    <text x="32" y="305" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="500">"Split in half every step ⚡ O(log n)"</text>
    <text x="32" y="320" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="600">#CSE #Coding #HackBriven</text>

    <!-- Waveform Coach Pill -->
    <rect x="20" y="345" width="210" height="42" rx="12" fill="#1e293b" stroke="#ff7f55" stroke-opacity="0.5"/>
    <text x="32" y="370" fill="#ff9e78" font-family="sans-serif" font-size="10" font-weight="700">🎙️ Voice Coach: 92% Clarity</text>

    <!-- Publish CTA Button -->
    <rect x="20" y="400" width="210" height="38" rx="19" fill="#ff7f55"/>
    <text x="125" y="424" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">Publish to Qoneqt ✓</text>
  </g>

  <!-- Floating DNA Badge Card -->
  <g transform="translate(680, 110)">
    <rect width="180" height="120" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="22" fill="#ff7f55" fill-opacity="0.2"/>
    <text x="45" y="52" fill="#ff7f55" font-family="sans-serif" font-size="18" text-anchor="middle">🧬</text>
    <text x="80" y="38" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Creator DNA</text>
    <text x="80" y="55" fill="#22c55e" font-family="sans-serif" font-size="14" font-weight="800">94% Sync</text>
    <text x="25" y="95" fill="#94a3b8" font-family="sans-serif" font-size="11">Tech (CSE) · Friendly</text>
  </g>

  <!-- Floating Audience Mirror Card -->
  <g transform="translate(680, 260)">
    <rect width="180" height="125" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="35" fill="#a5b4fc" font-family="sans-serif" font-size="12" font-weight="700">👥 Audience Mirror</text>
    <text x="25" y="65" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="800">91% Resonance</text>
    <text x="25" y="90" fill="#22c55e" font-family="sans-serif" font-size="11" font-weight="600">✓ Students (18-24)</text>
    <text x="25" y="108" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">✓ Beginner Coders</text>
  </g>
</svg>
